# ─── Plugins (TPM) ────────────────────────────────────────────────
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.tmux/plugins"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'egel/tmux-gruvbox'

# ─── General ──────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -sg escape-time 0
set -g history-limit 50000
set -g renumber-windows on
set -g set-clipboard on

# ─── Terminal / Ghostty ───────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -s extended-keys on
set -as terminal-features 'xterm-ghostty:extkeys'
set -g allow-passthrough on
set -g update-environment "TERM_PROGRAM TERM_PROGRAM_VERSION"

# ─── Theme ────────────────────────────────────────────────────────
# Default to dark; dark-mode-notify will override on launch and on
# every macOS appearance change via ~/.tmux/theme-switch.sh
set -g @tmux-gruvbox 'dark'

# ─── Session persistence ─────────────────────────────────────────
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ─── Keybindings ──────────────────────────────────────────────────

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded"

# Splits (keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (5 cells at a time)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Sesh session picker (fzf-powered)
bind g display-popup -E -w 60% -h 60% "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 55%,60% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
)\""

# Create new sesh session from zoxide
bind T display-popup -E -w 40% -h 40% "sesh connect \"$(
  zoxide query -l | fzf-tmux -p 40%,40% \
    --border-label ' zoxide ' --prompt '📁  '
)\""

# ─── Initialize TPM (keep at very bottom) ─────────────────────────
run '~/.tmux/plugins/tpm/tpm'
